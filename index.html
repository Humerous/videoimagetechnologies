<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Video Image Technologies provides technical media data systems for secure handling, reliable backup, structured archive and clean workflow handover."
    />
    <meta name="theme-color" content="#071638" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon_io/favicon-32x32.png"
    />
    <link rel="stylesheet" href="/css/holding.css" />
    <title>Video Image Technologies | New Website Coming Soon</title>
  </head>

  <body>
    <main class="holding-page">
      <section class="identity" aria-labelledby="company-name">
        <div class="identity__content">
          <h1 id="company-name" class="visually-hidden">
            Video Image Technologies
          </h1>

          <div class="brand-lockup" aria-hidden="true">
            <img
              src="/assets/img/brand/VIT_TECHNICAL_THEME.png"
              alt=""
              width="1870"
              height="841"
            />
          </div>

          <p class="status">
            <span class="status__signal" aria-hidden="true"></span>
            A new website is in development.
          </p>

          <p class="positioning">
            Technical media data systems for secure handling, reliable backup,
            structured archive and clean workflow handover.
          </p>

          <p class="services" aria-label="VIT service process">
            <span>Ingest</span>
            <span>Process</span>
            <span>Manage</span>
            <span>Store</span>
            <span>Protect</span>
            <span>Handover</span>
          </p>
        </div>

        <div class="technical-visual" aria-hidden="true">
          <img
            src="/assets/img/brand/VIT_TECHNICAL_THEME.png"
            alt=""
            width="1870"
            height="841"
          />
        </div>
      </section>
    </main>

    <footer>
      <p>© <span id="year"></span> Video Image Technologies</p>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
