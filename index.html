<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Video Image Technologies — clear vision, reliable systems and media data systems architecture."
    />
    <meta name="theme-color" content="#020b1d" />
    <meta property="og:title" content="Video Image Technologies" />
    <meta property="og:description" content="Clear Vision. Reliable Systems." />
    <title>Video Image Technologies | Website in Progress</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --navy: #020b1d;
        --field: #071634;
        --placeholder: #aeb7c9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--navy);
      }

      body {
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .landing-page {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 48%,
            rgba(17, 64, 135, 0.28),
            transparent 52%
          ),
          #010816;
      }

      .artboard {
        width: min(100vw, calc(100svh * 1.7779));
        aspect-ratio: 1672 / 941;
      }

      .banner-image {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .interactive-form {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .email-hotspot,
      .notify-hotspot,
      .social-hotspot {
        position: absolute;
        z-index: 2;
        display: block;
        pointer-events: auto;
      }

      .email-hotspot {
        left: 24.35%;
        top: 63.42%;
        width: 33.65%;
        height: 9.1%;
      }

      .email-hotspot .form-control {
        width: 100%;
        height: 100%;
        padding: 0 5% 0 15%;
        border: 0;
        border-radius: 0;
        color: #fff !important;
        -webkit-text-fill-color: #fff;
        background: transparent !important;
        background-color: transparent !important;
        font-size: clamp(0.65rem, 1.3vw, 1.3rem);
        font-weight: 500;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
        box-shadow: none;
      }

      .email-hotspot .form-control::placeholder,
      .mobile-form .form-control::placeholder {
        color: var(--placeholder) !important;
        -webkit-text-fill-color: var(--placeholder);
        opacity: 1;
      }

      .email-hotspot .form-control:focus {
        background: rgba(2, 11, 29, 0.18) !important;
        box-shadow: inset 0 0 0 1px rgba(104, 216, 255, 0.76);
      }

      .form-control:-webkit-autofill,
      .form-control:-webkit-autofill:hover,
      .form-control:-webkit-autofill:focus {
        -webkit-text-fill-color: #fff;
        caret-color: #fff;
        box-shadow: 0 0 0 1000px #071634 inset !important;
        transition: background-color 9999s ease-out 0s;
      }

      .notify-hotspot {
        left: 57.9%;
        top: 63.42%;
        width: 15.2%;
        height: 9.1%;
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      .notify-hotspot:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .notify-hotspot:focus-visible {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.74);
      }

      .email-hotspot:focus-within,
      .notify-hotspot:focus-visible,
      .social-hotspot:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .linkedin-hotspot {
        left: 32.6%;
        top: 76.55%;
        width: 14.6%;
        height: 6.8%;
      }

      .instagram-hotspot {
        left: 51.7%;
        top: 76.55%;
        width: 15.2%;
        height: 6.8%;
      }

      .social-hotspot {
        border-radius: 8px;
        transition: outline-color 160ms ease;
      }

      .social-hotspot:hover {
        background: transparent;
      }

      .form-message {
        width: 62%;
        min-height: 1.4rem;
        position: absolute;
        left: 19%;
        top: 73.1%;
        z-index: 3;
        color: #fff;
        font-size: clamp(0.55rem, 0.95vw, 0.88rem);
        letter-spacing: 0.06em;
        text-align: center;
        text-shadow: 0 2px 8px #000;
      }

      .mobile-actions {
        display: none;
      }

      @media (max-width: 767.98px) {
        .landing-page {
          display: flex;
          flex-direction: column;
          justify-content: center;
          overflow-y: auto;
        }

        .artboard {
          width: min(100%, 760px);
          filter: drop-shadow(0 24px 46px rgba(0, 0, 0, 0.32));
        }

        .interactive-form,
        .social-hotspot,
        .form-message {
          display: none;
        }

        .mobile-actions {
          width: min(520px, calc(100% - 32px));
          margin: 18px auto 30px;
          display: block;
        }

        .mobile-form .form-control,
        .mobile-form .btn {
          min-height: 50px;
          border-color: rgba(255, 255, 255, 0.48);
          color: #fff !important;
          -webkit-text-fill-color: #fff;
          background: var(--field) !important;
          background-color: var(--field) !important;
        }

        .mobile-form .form-control:focus {
          border-color: #28b9ff;
          box-shadow: 0 0 0 0.2rem rgba(40, 185, 255, 0.2);
        }

        .mobile-form .btn:hover,
        .mobile-form .btn:focus-visible {
          border-color: #3ecbff;
          background: linear-gradient(110deg, #0f2856, var(--field)) !important;
        }

        .mobile-message {
          min-height: 1.45rem;
          margin-top: 12px;
          color: #dce6f8;
          font-size: 0.78rem;
          text-align: center;
        }

        .mobile-socials {
          margin-top: 22px;
          display: flex;
          justify-content: center;
          gap: 34px;
        }

        .mobile-socials a {
          color: #fff;
          font-size: 0.78rem;
          letter-spacing: 0.18em;
          text-decoration: none;
          text-transform: uppercase;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      const forms = document.querySelectorAll(
        ".interactive-form, .mobile-form",
      );

      forms.forEach((form) => {
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const button = form.querySelector('button[type="submit"]');
          const message = form.classList.contains("mobile-form")
            ? document.querySelector(".mobile-message")
            : document.querySelector(".form-message");
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 12000);

          button.disabled = true;
          form.setAttribute("aria-busy", "true");
          message.textContent = "Sending…";

          try {
            const response = await fetch(form.action, {
              method: "POST",
              body: new FormData(form),
              headers: { Accept: "application/json" },
              signal: controller.signal,
            });

            if (!response.ok) throw new Error("Submission failed");

            form.reset();
            message.textContent =
              "Thank you — we’ll let you know when the new site is live.";
            message.style.color = "#76f29d";
          } catch {
            message.textContent =
              "We couldn’t send that. Please check your connection and try again.";
            message.style.color = "#ff9b9b";
          } finally {
            window.clearTimeout(timeout);
            button.disabled = false;
            form.removeAttribute("aria-busy");
          }
        });
      });
    </script>
